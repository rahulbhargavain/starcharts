[project]
name = "starcharts"
version = "0.1.0"
description = "Search real astronomical history for dates matching a textual sky description (janam patris, epic verses), with precession, ayanamsha, and calendar conversion handled explicitly."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "pyswisseph>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
