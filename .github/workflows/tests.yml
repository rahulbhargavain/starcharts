name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.5"
      - run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        ephemeris-files: [with-data-files, moshier-only]
    name: pytest (${{ matrix.python-version }}, ${{ matrix.ephemeris-files }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Cache Swiss Ephemeris data files
        if: matrix.ephemeris-files == 'with-data-files'
        uses: actions/cache@v4
        with:
          path: ephe/*.se1
          key: ephe-${{ hashFiles('ephe/download.sh') }}
      - name: Download Swiss Ephemeris data files
        if: matrix.ephemeris-files == 'with-data-files'
        run: bash ephe/download.sh
      - run: python -m pytest -q -rs
